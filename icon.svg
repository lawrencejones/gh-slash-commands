<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background: GitHub accent blue, rounded square -->
  <rect width="128" height="128" rx="28" fill="#0969da"/>
  <!-- Speech bubble: a comment -->
  <path d="M34 22 h60 a14 14 0 0 1 14 14 v40 a14 14 0 0 1 -14 14 h-38 l-20 18 v-18 h-2 a14 14 0 0 1 -14 -14 v-40 a14 14 0 0 1 14 -14 z" fill="#ffffff"/>
  <!-- The slash being typed -->
  <path d="M60 36 L44 76" stroke="#0969da" stroke-width="11" stroke-linecap="round"/>
  <!-- Completion text: one solid word, one faded -->
  <rect x="68" y="42" width="30" height="9" rx="4.5" fill="#0969da"/>
  <rect x="68" y="61" width="22" height="9" rx="4.5" fill="#0969da" opacity="0.35"/>
</svg>
