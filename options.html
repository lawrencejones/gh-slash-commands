<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GitHub slash command autocomplete</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13px;
        margin: 16px;
        min-width: 420px;
        color: #1f2328;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 12px 0 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        font: inherit;
      }
      .hint {
        color: #656d76;
        margin-top: 4px;
      }
      button {
        margin-top: 12px;
        margin-right: 8px;
        padding: 5px 12px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        background: #f6f8fa;
        font: inherit;
        cursor: pointer;
      }
      #status {
        margin-top: 10px;
        color: #1a7f37;
      }
      ul {
        padding-left: 18px;
        margin: 6px 0;
      }
      code {
        font-family: ui-monospace, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <label for="token">GitHub token (optional)</label>
    <input id="token" type="password" autocomplete="off" placeholder="github_pat_…" />
    <div class="hint">
      Workflows are read through your github.com session, so this is only needed if that
      stops working. A fine-grained token with read access to repository contents is enough.
    </div>

    <label for="ttl">Refresh workflows every (hours)</label>
    <input id="ttl" type="number" min="1" step="1" />

    <button id="save">Save</button>
    <button id="clear">Clear cached commands</button>
    <div id="status"></div>

    <label>Cached repositories</label>
    <ul id="cached"></ul>
    <script src="options.js"></script>
  </body>
</html>
